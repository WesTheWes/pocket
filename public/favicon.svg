<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The tab icon: the pink piano on its own, without the app icon's dark backdrop. -->
  <rect width="256" height="256" rx="48" fill="#f08ba0"/>
  <!-- white keys -->
  <rect x="24" y="128" width="38" height="100" rx="5" fill="#f4ebdd"/>
  <rect x="66" y="128" width="38" height="100" rx="5" fill="#f4ebdd"/>
  <rect x="108" y="128" width="38" height="100" rx="5" fill="#f4ebdd"/>
  <rect x="150" y="128" width="38" height="100" rx="5" fill="#f4ebdd"/>
  <rect x="192" y="128" width="38" height="100" rx="5" fill="#f4ebdd"/>
  <!-- black keys, in the real C-D-E-F-G pattern (none between E and F) -->
  <rect x="55" y="128" width="18" height="60" rx="4" fill="#14110f"/>
  <rect x="97" y="128" width="18" height="60" rx="4" fill="#14110f"/>
  <rect x="181" y="128" width="18" height="60" rx="4" fill="#14110f"/>
</svg>
