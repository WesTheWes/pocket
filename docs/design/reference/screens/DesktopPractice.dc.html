<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket — Practice (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110F}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#A99E92;opacity:1}
a:focus-visible,button:focus-visible{outline:2px solid #F3CF6B;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:820px;background:#14110F;color:#F4EBDD;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.4;overflow:hidden;">
<div style="display:flex;width:1280px;height:820px;">
<div style="display:flex;flex-direction:column;gap:18px;width:380px;height:820px;padding:28px 24px;background:#1D1917;border-right:1px solid #352F2B;">
<div style="display:flex;align-items:center;gap:10px;">
<a href="Main.dc.html" aria-label="Back to songs" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:#F4EBDD;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
<button type="button" onClick="{{ openPicker }}" aria-label="Change song" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:28px;background:#272220;border:1px solid #352F2B;text-align:left;">
<span style="flex:1;min-width:0;"><span style="display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ songTitle }}</span><span style="display:block;font-size:12px;color:#A99E92;">{{ songArtist }}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;color:#A99E92"><path d="m6 9 6 6 6-6"/></svg>
</button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;">
<div>
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Practice time</div>
<div style="font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;">{{ timeText }}</div>
</div>
<button type="button" onClick="{{ toggleTimer }}" aria-label="{{ timerLabel }}" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;">
<sc-if value="{{ timerOn }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></sc-if>
<sc-if value="{{ timerPaused }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></sc-if>
</button>
</div>
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;padding:0 4px;">Goals</div>
<div style="display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow:hidden;">
<sc-for list="{{ goalRows }}" as="g" hint-placeholder-count="8">
<button type="button" onClick="{{ g.pick }}" style="display:block;width:100%;min-height:52px;padding:6px 14px;border-radius:12px;background:{{ g.bg }};border:0;text-align:left;"><span style="display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:{{ g.secColor }};">{{ g.sec }}</span><span style="display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ g.t }}</span></button>
</sc-for>
</div>
<a href="Review.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;background:#F49B62;color:#14110F;font-weight:600;font-size:16px;">Finish practice</a>
</div>
<div style="display:flex;flex-direction:column;flex:1;min-width:0;padding:32px 64px 32px;">
<div style="display:flex;gap:8px;">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.active }}" aria-label="{{ c.aria }}" style="display:flex;flex-direction:column;justify-content:center;gap:7px;height:46px;flex:1;min-width:0;max-width:150px;padding:0 12px;border-radius:14px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};font-size:14px;font-weight:500;white-space:nowrap;text-align:left;"><span style="display:block;">{{ c.label }}</span><span style="display:block;height:4px;border-radius:2px;background:{{ c.track }};overflow:hidden;"><span style="display:block;width:{{ c.pct }}%;height:100%;border-radius:2px;background:{{ c.fill }};"></span></span></button>
</sc-for>
</div>
<div style="margin-top:12px;padding:28px 32px;border-radius:24px;background:#1D1917;">
<div style="display:flex;align-items:center;justify-content:space-between;">
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">{{ secLabel }} · {{ goalPos }}</div>
<a href="GoalProgress.dc.html" style="display:flex;align-items:center;height:44px;margin:-10px -8px -10px 0;padding:0 8px;font-size:14px;font-weight:600;color:#F49B62;">Log progress</a>
</div>
<div style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:44px;line-height:1.08;margin-top:6px;">{{ goalTitle }}</div>
<div style="font-size:16px;color:#A99E92;margin-top:8px;">{{ goalDesc }}</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:40px;margin-top:22px;">
<div>
<div style="font-size:12px;color:#A99E92;">Tempo</div>
<div style="font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 10px;">{{ curBpm }} / {{ tgtBpm }} BPM</div>
<div style="height:6px;border-radius:3px;background:#272220;overflow:hidden;"><div style="width:{{ bpmPct }}%;height:100%;border-radius:3px;background:#F49B62;"></div></div>
</div>
<div>
<div style="font-size:12px;color:#A99E92;">Quality</div>
<div style="font-size:17px;font-weight:600;margin:2px 0 10px;">{{ qCurName }}</div>
<div style="display:flex;gap:3px;">
<div style="flex:1;height:6px;border-radius:3px;background:{{ sg1.bg }};outline:{{ sg1.outline }};outline-offset:1.5px;"></div>
<div style="flex:1;height:6px;border-radius:3px;background:{{ sg2.bg }};outline:{{ sg2.outline }};outline-offset:1.5px;"></div>
<div style="flex:1;height:6px;border-radius:3px;background:{{ sg3.bg }};outline:{{ sg3.outline }};outline-offset:1.5px;"></div>
<div style="flex:1;height:6px;border-radius:3px;background:{{ sg4.bg }};outline:{{ sg4.outline }};outline-offset:1.5px;"></div>
<div style="flex:1;height:6px;border-radius:3px;background:{{ sg5.bg }};outline:{{ sg5.outline }};outline-offset:1.5px;"></div>
</div>
</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:28px;margin-top:16px;padding:24px 32px;border-radius:24px;background:#1D1917;">
<div style="display:flex;align-items:center;gap:14px;">
<button type="button" onClick="{{ dec }}" aria-label="Slower" style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M5 12h14"/></svg></button>
<div style="width:140px;text-align:center;">
<div style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:84px;line-height:.95;font-variant-numeric:tabular-nums;">{{ bpm }}</div>
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;margin-top:4px;">BPM</div>
</div>
<button type="button" onClick="{{ inc }}" aria-label="Faster" style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div style="flex:1;min-width:0;">
<div style="display:flex;justify-content:center;gap:14px;padding-bottom:6px;">
<sc-for list="{{ beats }}" as="b" hint-placeholder-count="4">
<div style="width:10px;height:10px;border-radius:5px;background:{{ b.bg }};transform:scale({{ b.scale }});"></div>
</sc-for>
</div>
<input type="range" min="40" max="200" value="{{ bpm }}" onChange="{{ onSlide }}" aria-label="Tempo" style="display:block;width:100%;height:44px;margin:0;accent-color:#F49B62;">
</div>
<button type="button" onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:42px;background:#F49B62;color:#14110F;border:0;flex-shrink:0;">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></sc-if>
<sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></sc-if>
</button>
</div>
<div style="display:flex;gap:12px;margin-top:auto;">
<button type="button" onClick="{{ prev }}" disabled="{{ prevDis }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:26px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;font-weight:600;font-size:15px;opacity:{{ prevOp }};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="m15 6-6 6 6 6"/></svg>Previous goal</button>
<button type="button" onClick="{{ next }}" disabled="{{ nextDis }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:26px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;font-weight:600;font-size:15px;opacity:{{ nextOp }};">Next goal<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</div>
</div>
<sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,7,.74);">
<div style="width:440px;background:#1D1917;border-radius:28px;padding:28px;">
<div style="display:flex;align-items:center;justify-content:space-between;">
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Practice a different song</div>
<button type="button" onClick="{{ closePicker }}" aria-label="Close song list" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-10px -10px -10px 0;border-radius:22px;background:transparent;border:0;color:#F4EBDD;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;color:#A99E92"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:14px;">
<sc-for list="{{ songRows }}" as="row" hint-placeholder-count="3">
<button type="button" onClick="{{ row.pick }}" style="display:block;width:100%;height:64px;padding:0 16px;border-radius:16px;background:{{ row.bg }};border:1px solid #352F2B;text-align:left;"><span style="display:block;font-size:16px;font-weight:600;">{{ row.title }}</span><span style="display:block;font-size:13px;color:#A99E92;">{{ row.artist }}</span></button>
</sc-for>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 820}}'>
class Component extends DCLogic {
  songData() {
    return [
      { title: 'Piano Man', artist: 'Billy Joel', goals: [
        { sec: 'Intro', t: 'Harmonica line on right hand', d: 'Melody only. Hold the long notes for their full value.', tb: 76, cb: 76, tq: 4, cq: 4 },
        { sec: 'Verse', t: 'Left hand waltz pattern', d: 'Root, fifth, fifth in 3/4. Steady, no rushing.', tb: 72, cb: 72, tq: 4, cq: 4 },
        { sec: 'Verse', t: 'First 4 bars with only bass and melody', d: 'Right hand melody, left hand bass. No inner voices yet.', tb: 84, cb: 76, tq: 4, cq: 3 },
        { sec: 'Chorus', t: 'Full chorus with block chords', d: 'Both hands in block chords, landing every downbeat.', tb: 90, cb: 68, tq: 4, cq: 2 },
        { sec: 'Chorus', t: 'Walk-up fill into bar 5', d: 'Four-note run in the right hand into the next phrase.', tb: 84, cb: 60, tq: 4, cq: 2 },
        { sec: 'Bridge', t: 'Play the entire section in a stride piano style', d: 'Bass note, then chord, alternating. Keep the left hand loose.', tb: 100, cb: 60, tq: 4, cq: 1 },
        { sec: 'Outro', t: 'Land the ending fill', d: 'Slow the last bar and let the final chord ring.', tb: 72, cb: 72, tq: 5, cq: 5 },
        { sec: 'Song', t: 'Play start to finish without stopping', d: 'No restarts. Recover from mistakes and keep the pulse.', tb: 84, cb: 70, tq: 4, cq: 2 }
      ] },
      { title: "Don't Stop Believin'", artist: 'Journey', goals: [
        { sec: 'Intro', t: 'Steady eighth-note figure', d: 'Even touch in the right hand, no accents.', tb: 118, cb: 118, tq: 4, cq: 5 },
        { sec: 'Verse', t: 'Comp chords with the anticipated push', d: 'Land the push a sixteenth early, every time.', tb: 118, cb: 110, tq: 4, cq: 3 },
        { sec: 'Chorus', t: 'Octave melody in the right hand', d: 'Keep the octaves relaxed through the last line.', tb: 118, cb: 118, tq: 4, cq: 4 }
      ] },
      { title: 'Sir Duke', artist: 'Stevie Wonder', goals: [
        { sec: 'Intro', t: 'Unison horn line, right hand', d: 'Crisp staccato on the offbeats.', tb: 96, cb: 88, tq: 4, cq: 3 },
        { sec: 'Verse', t: 'Walking left hand bass', d: 'Steady quarter notes under the melody.', tb: 100, cb: 84, tq: 4, cq: 2 },
        { sec: 'Bridge', t: 'Chromatic run at the turnaround', d: 'Slow, then bring it up in small steps.', tb: 92, cb: 60, tq: 4, cq: 1 }
      ] }
    ];
  }
  getSt() {
    return Object.assign({ songIdx: 0, goalIdx: 2, playing: false, bpm: 76, beat: 0, secs: 1450, timerOn: true, picker: false }, this.state || {});
  }
  componentDidMount() {
    this._t = setInterval(() => {
      const st = this.getSt();
      if (st.timerOn) this.setState({ secs: st.secs + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this._t);
    clearTimeout(this._m);
    this._on = false;
    try { if (this._ac) this._ac.close(); } catch (e) {}
  }
  ensureAudio() {
    try {
      if (!this._ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this._ac = new AC();
      }
      if (this._ac && this._ac.state === 'suspended') this._ac.resume();
    } catch (e) {}
  }
  clickSound(accent) {
    try {
      const ac = this._ac;
      if (!ac) return;
      const t = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.value = accent ? 1600 : 1000;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.35, t + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.06);
    } catch (e) {}
  }
  metroTick() {
    if (!this._on) return;
    const b = this._beat;
    this.clickSound(b === 0);
    this.setState({ beat: b });
    this._beat = (b + 1) % 4;
    this._nextAt += 60000 / this.getSt().bpm;
    this._m = setTimeout(() => this.metroTick(), Math.max(0, this._nextAt - performance.now()));
  }
  goToGoal(i) {
    const st = this.getSt();
    const goals = this.songData()[st.songIdx].goals;
    const n = Math.max(0, Math.min(goals.length - 1, i));
    this.setState({ goalIdx: n, bpm: goals[n].cb });
  }
  changeBpm(n) {
    if (isNaN(n)) return;
    this.setState({ bpm: Math.max(30, Math.min(240, n)) });
  }
  renderVals() {
    const self = this;
    const st = this.getSt();
    const songs = this.songData();
    const song = songs[st.songIdx];
    const goal = song.goals[st.goalIdx];
    const Q = ['', "Can't play at all", 'Lots of mistakes', 'Some mistakes', 'Solid', 'Mastered'];
    const C = ['', '#B8677A', '#F08BA0', '#F49B62', '#F3CF6B', '#F4EBDD'];
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const seg = (i) => ({
      bg: i <= goal.cq ? C[goal.cq] : '#272220',
      outline: (i === 4 && i > goal.cq) ? '1.5px solid #F3CF6B' : 'none'
    });
    const names = [];
    song.goals.forEach((g) => { if (names.indexOf(g.sec) < 0) names.push(g.sec); });
    const chips = names.map((n) => {
      const on = goal.sec === n;
      const gs = song.goals.filter((g) => g.sec === n);
      const pct = Math.round(gs.reduce((a, g) => a + (Math.min(1, g.cb / g.tb) + Math.min(1, g.cq / 4)) / 2, 0) / gs.length * 100);
      const label = n === 'Song' ? 'Whole song' : n;
      return {
        label: label,
        aria: label + ', ' + pct + ' percent',
        pct: pct,
        active: on,
        bg: on ? '#F4EBDD' : 'transparent',
        fg: on ? '#14110F' : '#F4EBDD',
        bd: on ? '#F4EBDD' : '#352F2B',
        track: on ? '#CFC3B1' : '#352F2B',
        fill: on ? '#14110F' : '#F49B62',
        pick: () => self.goToGoal(song.goals.findIndex((g) => g.sec === n))
      };
    });
    const goalRows = song.goals.map((g, i) => ({
      sec: g.sec === 'Song' ? 'Whole song' : g.sec,
      t: g.t,
      bg: i === st.goalIdx ? '#272220' : 'transparent',
      secColor: i === st.goalIdx ? '#F49B62' : '#A99E92',
      pct: Math.min(100, Math.round(g.cb / g.tb * 100)),
      pick: () => self.goToGoal(i)
    }));
    const songRows = songs.map((s, i) => ({
      title: s.title,
      artist: s.artist,
      bg: i === st.songIdx ? '#272220' : 'transparent',
      pick: () => self.setState({ songIdx: i, picker: false, goalIdx: 0, bpm: s.goals[0].cb })
    }));
    const beats = [0, 1, 2, 3].map((i) => {
      const on = st.playing && st.beat === i;
      return { bg: on ? (i === 0 ? '#F49B62' : '#F4EBDD') : '#352F2B', scale: on ? 1.4 : 1 };
    });
    return {
      songTitle: song.title,
      songArtist: song.artist,
      timeText: pad(Math.floor(st.secs / 60)) + ':' + pad(st.secs % 60),
      timerOn: st.timerOn,
      timerPaused: !st.timerOn,
      timerLabel: st.timerOn ? 'Pause timer' : 'Resume timer',
      toggleTimer: () => self.setState({ timerOn: !self.getSt().timerOn }),
      chips: chips,
      goalRows: goalRows,
      songRows: songRows,
      beats: beats,
      secLabel: goal.sec === 'Song' ? 'Whole song' : goal.sec,
      goalPos: 'Goal ' + (st.goalIdx + 1) + ' of ' + song.goals.length,
      goalTitle: goal.t,
      goalDesc: goal.d,
      curBpm: goal.cb,
      tgtBpm: goal.tb,
      bpmPct: Math.min(100, Math.round(goal.cb / goal.tb * 100)),
      qCurName: Q[goal.cq],
      sg1: seg(1), sg2: seg(2), sg3: seg(3), sg4: seg(4), sg5: seg(5),
      bpm: st.bpm,
      playing: st.playing,
      notPlaying: !st.playing,
      playLabel: st.playing ? 'Pause metronome' : 'Start metronome',
      togglePlay: () => {
        const p = !self.getSt().playing;
        clearTimeout(self._m);
        self._on = p;
        if (p) {
          self.ensureAudio();
          self._beat = 0;
          self._nextAt = performance.now();
          self.setState({ playing: true });
          self.metroTick();
        } else {
          self.setState({ playing: false, beat: 0 });
        }
      },
      dec: () => self.changeBpm(self.getSt().bpm - 1),
      inc: () => self.changeBpm(self.getSt().bpm + 1),
      onSlide: (e) => self.changeBpm(parseInt(e.target.value, 10)),
      prev: () => self.goToGoal(self.getSt().goalIdx - 1),
      next: () => self.goToGoal(self.getSt().goalIdx + 1),
      prevDis: st.goalIdx === 0,
      nextDis: st.goalIdx === song.goals.length - 1,
      prevOp: st.goalIdx === 0 ? 0.4 : 1,
      nextOp: st.goalIdx === song.goals.length - 1 ? 0.4 : 1,
      pickerOpen: st.picker,
      openPicker: () => self.setState({ picker: true }),
      closePicker: () => self.setState({ picker: false })
    };
  }
}
</script>
</body>
