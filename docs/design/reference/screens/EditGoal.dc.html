<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket — Edit goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110F}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#A99E92;opacity:1}
a:focus-visible,button:focus-visible{outline:2px solid #F3CF6B;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#14110F;color:#F4EBDD;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.4;">
<div style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:8px 12px 0 8px;"><a href="Goals.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:transparent;color:#F4EBDD;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><div style="font-size:15px;font-weight:600;">Edit goal</div><div style="display:flex;min-width:44px;justify-content:flex-end;"></div></div>
<div style="display:flex;flex-direction:column;gap:22px;padding:8px 20px 0;">
<div><div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Applies to</div><div style="display:flex;flex-wrap:wrap;gap:0 8px;margin-top:4px;"><button type="button" onClick="{{ s0.pick }}" aria-pressed="{{ s0.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s0.bd }};background:{{ s0.bg }};color:{{ s0.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Whole song</span></button><button type="button" onClick="{{ s1.pick }}" aria-pressed="{{ s1.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s1.bd }};background:{{ s1.bg }};color:{{ s1.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Intro</span></button><button type="button" onClick="{{ s2.pick }}" aria-pressed="{{ s2.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s2.bd }};background:{{ s2.bg }};color:{{ s2.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Verse</span></button><button type="button" onClick="{{ s3.pick }}" aria-pressed="{{ s3.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s3.bd }};background:{{ s3.bg }};color:{{ s3.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Chorus</span></button><button type="button" onClick="{{ s4.pick }}" aria-pressed="{{ s4.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s4.bd }};background:{{ s4.bg }};color:{{ s4.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Bridge</span></button><button type="button" onClick="{{ s5.pick }}" aria-pressed="{{ s5.on }}" style="height:44px;padding:0;background:transparent;border:0;"><span style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1px solid {{ s5.bd }};background:{{ s5.bg }};color:{{ s5.fg }};font-size:14px;font-weight:500;white-space:nowrap;">Outro</span></button></div></div>
<div style="display:flex;flex-direction:column;gap:8px;"><label for="gtitle" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Title</label><input id="gtitle" type="text" value="First 4 bars with only bass and melody" placeholder="e.g. Play the first 4 bars with only bass and melody" style="width:100%;border-radius:14px;background:#1D1917;border:1px solid #352F2B;color:#F4EBDD;font-size:16px;padding:0 16px;height:52px;"></div>
<div style="display:flex;flex-direction:column;gap:8px;"><label for="gdesc" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Description</label><textarea id="gdesc" placeholder="What does success look like?" style="width:100%;border-radius:14px;background:#1D1917;border:1px solid #352F2B;color:#F4EBDD;font-size:16px;padding:0 16px;min-height:100px;padding:14px 16px;line-height:1.6;resize:none;">Right hand melody, left hand bass. No inner voices yet.</textarea></div>
<div>
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A99E92;">Target tempo</div>
<div style="display:flex;align-items:center;justify-content:space-between;height:68px;margin-top:8px;padding:0 10px;border-radius:16px;background:#1D1917;border:1px solid #352F2B;">
<button type="button" onClick="{{ dec }}" aria-label="Decrease tempo" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M5 12h14"/></svg></button>
<div style="text-align:center;"><span style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:36px;font-variant-numeric:tabular-nums;">{{ bpm }}</span><span style="font-size:14px;color:#A99E92;"> BPM</span></div>
<button type="button" onClick="{{ inc }}" aria-label="Increase tempo" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#272220;border:1px solid #352F2B;color:#F4EBDD;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;"><a href="Goals.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;background:#F49B62;color:#14110F;font-weight:600;font-size:16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Save changes</a><a href="DeleteGoal.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;border:1px solid #F08BA0;color:#F08BA0;font-weight:600;font-size:16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete goal</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  getSt() {
    return Object.assign({ bpm: 84, scope: 2 }, this.state || {});
  }
  changeBpm(n) {
    this.setState({ bpm: Math.max(30, Math.min(240, n)) });
  }
  renderVals() {
    const self = this;
    const st = this.getSt();
    const out = {
      bpm: st.bpm,
      dec: () => self.changeBpm(self.getSt().bpm - 1),
      inc: () => self.changeBpm(self.getSt().bpm + 1)
    };
    for (let i = 0; i < 6; i++) {
      const on = st.scope === i;
      out['s' + i] = { on: on, bg: on ? '#F4EBDD' : 'transparent', fg: on ? '#14110F' : '#F4EBDD', bd: on ? '#F4EBDD' : '#352F2B', pick: () => self.setState({ scope: i }) };
    }
    return out;
  }
}
</script>
</body>
</html>
